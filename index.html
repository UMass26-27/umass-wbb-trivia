<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>UMass WBB Trivia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>UMass Women's Basketball</h1>
  <div class="sub" id="gameSub">Away Game Trivia</div>
</header>
<main id="app">
  <div class="card center"><div class="spinner"></div><div class="muted">Loading quiz…</div></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, collection, query, orderBy, getDocs, addDoc,
  serverTimestamp, onSnapshot, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { isCorrect, computeLeaderboard, gameLabel, generateWordSearch, wsLinePath, wsMatchWord } from "./shared.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const appEl = document.getElementById("app");
const subEl = document.getElementById("gameSub");

const params = new URLSearchParams(location.search);
const gameId = params.get("g");
const storageKey = gameId ? `umass-trivia-${gameId}` : null;

function render(html) { appEl.innerHTML = html; }

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function main() {
  if (!gameId) {
    render(`<div class="card"><h2>No quiz linked</h2><p class="muted">Scan the QR code your coach gave you — this link is missing a game ID.</p></div>`);
    return;
  }

  let gameSnap;
  try {
    gameSnap = await getDoc(doc(db, "games", gameId));
  } catch (e) {
    render(`<div class="card"><h2>Couldn't load quiz</h2><p class="error">${escapeHtml(e.message)}</p></div>`);
    return;
  }

  if (!gameSnap.exists()) {
    render(`<div class="card"><h2>Quiz not found</h2><p class="muted">Check the link or QR code with your coach.</p></div>`);
    return;
  }

  const game = { id: gameSnap.id, ...gameSnap.data() };
  subEl.textContent = gameLabel(game);
  document.title = `Trivia — ${game.opponent}`;

  const already = storageKey ? sessionStorage.getItem(storageKey) : null;

  if (game.status === "draft") {
    render(`<div class="card center"><h2>Not open yet</h2><p class="muted">Ask your coach to start the quiz, then refresh this page.</p></div>`);
    return;
  }

  if (game.status === "closed" || already) {
    if (already) {
      render(`<div class="card center"><p class="muted">You already submitted as <strong>${escapeHtml(already)}</strong>.</p></div>` + leaderboardShell());
    } else {
      render(`<div class="card center"><h2>Quiz closed</h2><p class="muted">Here's how everyone did.</p></div>` + leaderboardShell());
    }
    watchLeaderboard(game, already);
    return;
  }

  showNameEntry(game);
}

function leaderboardShell() {
  return `<div class="card"><h2>Leaderboard</h2><div id="lb"><div class="muted center">Loading…</div></div></div>`;
}

function watchLeaderboard(game, highlightName) {
  const q = query(collection(db, "games", game.id, "responses"));
  onSnapshot(q, snap => {
    const responses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const lbEl = document.getElementById("lb");
    if (!lbEl) return;
    if (!responses.length) {
      lbEl.innerHTML = `<p class="muted center">No submissions yet.</p>`;
      return;
    }
    const ranked = computeLeaderboard(responses, game);
    lbEl.innerHTML = ranked.map((r, i) => `
      <div class="rank-row">
        <div class="rank-num">${i + 1}</div>
        <div class="rank-name">${escapeHtml(r.athleteName)}${highlightName === r.athleteName ? " (you)" : ""}</div>
        <div class="rank-meta">${r.correctCount}/${r.totalQuestions} correct${r.perfect ? " ⭐" : ""}</div>
        <div class="rank-pts">${r.total} pts</div>
      </div>`).join("");
  }, err => {
    const lbEl = document.getElementById("lb");
    if (lbEl) lbEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
  });
}

function showNameEntry(game) {
  render(`
    <div class="card">
      <h2>Ready to play?</h2>
      <p class="muted">Enter your name, then answer every question. First to submit a perfect score gets the most points — but every correct answer counts.</p>
      <label for="nameInput">Your name</label>
      <input type="text" id="nameInput" placeholder="e.g. Jane Smith" autocomplete="off">
      <div class="error hidden" id="nameErr"></div>
      <button class="btn" id="startBtn">Start Quiz</button>
    </div>
  `);
  document.getElementById("startBtn").addEventListener("click", async () => {
    const nameEl = document.getElementById("nameInput");
    const name = nameEl.value.trim();
    const errEl = document.getElementById("nameErr");
    if (!name) {
      errEl.textContent = "Enter your name to continue.";
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    startBtnDisable(true);
    try {
      const dupSnap = await getDocs(query(collection(db, "games", game.id, "responses"), where("athleteName", "==", name)));
      if (!dupSnap.empty) {
        if (storageKey) sessionStorage.setItem(storageKey, name);
        render(`<div class="card center"><p class="muted"><strong>${escapeHtml(name)}</strong> already submitted for this game.</p></div>` + leaderboardShell());
        watchLeaderboard(game, name);
        return;
      }
      await loadQuestionsAndPlay(game, name);
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.remove("hidden");
      startBtnDisable(false);
    }
  });
}

function startBtnDisable(v) {
  const b = document.getElementById("startBtn");
  if (b) { b.disabled = v; b.textContent = v ? "Loading…" : "Start Quiz"; }
}

async function loadQuestionsAndPlay(game, athleteName) {
  const format = game.quizFormat || "mc";
  const needsMc = format === "mc" || format === "both";
  const needsWs = format === "wordsearch" || format === "both";

  const [questions, words] = await Promise.all([
    needsMc ? getDocs(query(collection(db, "games", game.id, "questions"), orderBy("order"))).then(s => s.docs.map(d => ({ id: d.id, ...d.data() }))) : Promise.resolve([]),
    needsWs ? getDocs(collection(db, "games", game.id, "wordsearch")).then(s => s.docs.map(d => ({ id: d.id, ...d.data() }))) : Promise.resolve([])
  ]);

  const hasMc = needsMc && questions.length > 0;
  const hasWs = needsWs && words.length > 0;

  if (!hasMc && !hasWs) {
    render(`<div class="card"><h2>No questions yet</h2><p class="muted">Ask your coach — this quiz doesn't have questions loaded.</p></div>`);
    return;
  }

  const finalize = async result => {
    const perfect = result.totalQuestions > 0 && result.correctCount === result.totalQuestions;
    await addDoc(collection(db, "games", game.id, "responses"), {
      athleteName,
      correctCount: result.correctCount,
      totalQuestions: result.totalQuestions,
      perfect,
      submittedAt: serverTimestamp()
    });
    if (storageKey) sessionStorage.setItem(storageKey, athleteName);
    render(`
      <div class="card center">
        <h2>${perfect ? "Perfect score! 🎉" : "Submitted!"}</h2>
        <p class="muted">${athleteName}: ${result.correctCount}/${result.totalQuestions} correct</p>
      </div>
      ${leaderboardShell()}
    `);
    watchLeaderboard(game, athleteName);
  };

  if (hasMc && hasWs) {
    renderQuiz(game, questions, "Continue to Word Search", async mcResult => {
      renderWordSearch(game, words, "Submit Answers", wsResult => finalize({
        correctCount: mcResult.correctCount + wsResult.correctCount,
        totalQuestions: mcResult.totalQuestions + wsResult.totalQuestions
      }));
    });
  } else if (hasMc) {
    renderQuiz(game, questions, "Submit Answers", finalize);
  } else {
    renderWordSearch(game, words, "Submit Answers", finalize);
  }
}

function renderWordSearch(game, words, buttonLabel, onComplete) {
  let gridData;
  try {
    gridData = generateWordSearch(words.map(w => w.word));
  } catch (e) {
    render(`<div class="card"><h2>Word search couldn't be built</h2><p class="error">${escapeHtml(e.message)}</p><p class="muted">Ask your coach to check the word list.</p></div>`);
    return;
  }
  const { grid, gridSize, placements } = gridData;
  const found = new Set();
  let startCell = null;

  render(`
    <div class="card">
      <div class="progress" id="wsProgress">0 / ${words.length} found</div>
      <div class="ws-grid" id="wsGrid" style="grid-template-columns:repeat(${gridSize}, 1fr);">
        ${grid.map((row, r) => row.map((ch, c) => `<div class="ws-cell" data-r="${r}" data-c="${c}">${ch}</div>`).join("")).join("")}
      </div>
      <p class="muted" style="margin:10px 0 4px;">Tap the first letter, then the last letter of each hidden word.</p>
      <div class="ws-clues" id="wsClues">
        ${words.map(w => `
          <div class="ws-clue-row" data-word="${escapeHtml(w.word)}">
            <div class="ws-clue-check"></div>
            <div><span class="badge ${w.category === "nutrition" ? "nutrition" : "location"}">${w.category === "nutrition" ? "Nutrition" : "Location"}</span> ${escapeHtml(w.clue)}</div>
          </div>`).join("")}
      </div>
      <button class="btn" id="wsSubmitBtn" disabled>Find all words to continue</button>
    </div>
  `);

  const gridEl = document.getElementById("wsGrid");
  const submitBtn = document.getElementById("wsSubmitBtn");

  function cellEl(r, c) { return gridEl.querySelector(`[data-r="${r}"][data-c="${c}"]`); }

  function updateProgress() {
    document.getElementById("wsProgress").textContent = `${found.size} / ${words.length} found`;
    const done = found.size === words.length;
    submitBtn.disabled = !done;
    submitBtn.textContent = done ? buttonLabel : "Find all words to continue";
  }

  gridEl.addEventListener("click", ev => {
    const cell = ev.target.closest(".ws-cell");
    if (!cell) return;
    const r = parseInt(cell.getAttribute("data-r"), 10);
    const c = parseInt(cell.getAttribute("data-c"), 10);

    if (!startCell) {
      startCell = { r, c };
      cell.classList.add("selected");
      return;
    }

    const path = wsLinePath(startCell.r, startCell.c, r, c);
    const match = wsMatchWord(path, placements, found);
    if (match) {
      found.add(match);
      path.forEach(([pr, pc]) => cellEl(pr, pc).classList.add("found"));
      document.querySelector(`.ws-clue-row[data-word="${match}"]`)?.classList.add("found");
      updateProgress();
    }
    cellEl(startCell.r, startCell.c).classList.remove("selected");
    startCell = null;
  });

  submitBtn.addEventListener("click", async () => {
    submitBtn.disabled = true;
    submitBtn.textContent = "Loading…";
    try {
      await onComplete({ correctCount: found.size, totalQuestions: words.length });
    } catch (e) {
      submitBtn.disabled = false;
      submitBtn.textContent = buttonLabel;
      alert("Couldn't continue: " + e.message);
    }
  });
}

function renderQuiz(game, questions, buttonLabel, onComplete) {
  render(`
    <div class="card">
      <div class="progress" id="progress">0 / ${questions.length} answered</div>
      <form id="quizForm">
        ${questions.map((q, i) => `
          <div class="qcard" style="margin-bottom:20px;">
            <span class="badge ${q.category}">${q.category === "nutrition" ? "Nutrition" : "Location"}</span>
            <div class="qtext">${i + 1}. ${escapeHtml(q.text)}</div>
            ${q.options.map((opt, oi) => `
              <label class="option" data-q="${i}">
                <input type="radio" name="q${i}" value="${oi}">
                <span>${escapeHtml(opt)}</span>
              </label>
            `).join("")}
          </div>
        `).join("")}
        <button type="submit" class="btn" id="submitBtn" disabled>Answer all questions to continue</button>
      </form>
    </div>
  `);

  const form = document.getElementById("quizForm");
  const submitBtn = document.getElementById("submitBtn");
  const progressEl = document.getElementById("progress");

  function updateProgress() {
    const answered = questions.filter((_, i) => form.querySelector(`input[name="q${i}"]:checked`)).length;
    progressEl.textContent = `${answered} / ${questions.length} answered`;
    const done = answered === questions.length;
    submitBtn.disabled = !done;
    submitBtn.textContent = done ? buttonLabel : "Answer all questions to continue";
    form.querySelectorAll(".option").forEach(optEl => {
      const input = optEl.querySelector("input");
      optEl.classList.toggle("selected", input.checked);
    });
  }

  form.addEventListener("change", updateProgress);

  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Loading…";
    try {
      const selectedIdx = questions.map((_, i) => parseInt(form.querySelector(`input[name="q${i}"]:checked`).value, 10));
      let correctCount = 0;
      for (let i = 0; i < questions.length; i++) {
        const q = questions[i];
        const selectedText = q.options[selectedIdx[i]];
        if (await isCorrect(q, selectedText)) correctCount++;
      }
      await onComplete({ correctCount, totalQuestions: questions.length });
    } catch (e) {
      submitBtn.disabled = false;
      submitBtn.textContent = buttonLabel;
      alert("Couldn't continue: " + e.message);
    }
  });
}

main();
</script>
</body>
</html>
